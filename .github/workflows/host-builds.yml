name: Volta host builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            bundle: build/linux/x64/release/bundle
          - os: windows-2022
            platform: windows
            bundle: build/windows/x64/runner/Release
          - os: ubuntu-24.04
            platform: web
            bundle: build/web
            build_flags: --no-web-resources-cdn
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build ${{ matrix.platform }} --release --no-pub ${{ matrix.build_flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: volta-${{ matrix.platform }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
